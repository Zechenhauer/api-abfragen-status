<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API-Football PRO Monitor</title>

    <!-- Integriertes App-Icon für Homescreen und Browser-Tab -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23002395%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22>⚡</text></svg>">
    <link rel="apple-touch-icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23002395%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22>⚡</text></svg>">

    <style>
        :root {
            --bg-color: #070d1a;
            --card-bg: #0f1115;
            --accent-color: #00ff87;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; width: 100%; max-width: 520px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: var(--accent-color); margin-top: 0; font-size: 1.3rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .section-title { font-size: 0.85rem; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin: 18px 0 8px 0; letter-spacing: 0.5px; }
        .row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.9rem; align-items: center; }
        .label { color: var(--text-muted); }
        .value { font-weight: bold; }
        button { background: var(--accent-color); color: #000; border: none; padding: 12px 15px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 20px; font-size: 0.95rem; transition: background 0.2s; }
        button:hover { background: #00cc6a; }
        .loading { color: var(--text-muted); text-align: center; font-style: italic; padding: 20px; }
        .divider { height: 1px; background: var(--border-color); margin: 12px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚡ API-Football PRO Monitor</h2>
        <div id="statusContent" class="loading">Lade Kontodaten & Verbrauch...</div>
        <button onclick="checkApiStatus()">Status aktualisieren</button>
    </div>

    <script>
        const apiKey = "297322363f3bf16e1304cfb933a0c8d5";

        async function checkApiStatus() {
            const container = document.getElementById("statusContent");
            container.innerHTML = "Verbinde mit API...";

            try {
                const response = await fetch("https://v3.football.api-sports.io/status", {
                    headers: { "x-apisports-key": apiKey }
                });
                
                const data = await response.json();

                if (data.response && data.response.account) {
                    const acc = data.response.account;
                    const sub = data.response.subscription;
                    const req = data.response.requests;

                    let formattedDate = sub.end;
                    try {
                        formattedDate = new Date(sub.end).toLocaleDateString("de-DE", { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                    } catch(e) {}

                    container.innerHTML = `
                        <div class="section-title">👤 Konto & Abo</div>
                        <div class="row"><span class="label">Inhaber:</span> <span class="value">${acc.firstname} ${acc.lastname}</span></div>
                        <div class="row"><span class="label">Tarif (Plan):</span> <span class="value" style="color: var(--accent-color);">${sub.plan}</span></div>
                        <div class="row"><span class="label">Abo aktiv:</span> <span class="value">${sub.active ? '🟢 Ja' : '🔴 Nein'}</span></div>
                        <div class="row"><span class="label">Abo gültig bis:</span> <span class="value">${formattedDate}</span></div>

                        <div class="divider"></div>
                        <div class="section-title">📊 Tages-Verbrauch & Limit</div>
                        <div class="row"><span class="label">Bereits verbraucht heute:</span> <span class="value">${req.current} Anfragen</span></div>
                        <div class="row"><span class="label">Tägliches Limit:</span> <span class="value" style="color: var(--accent-color);">${req.limit_day} Anfragen</span></div>
                        <div class="row"><span class="label">Heute noch übrig:</span> <span class="value">${req.limit_day - req.current} Anfragen</span></div>
                    `;
                } else {
                    container.innerHTML = `<span style="color: #ff3333;">Fehler: Ungültige Antwort der API.</span>`;
                }
            } catch (error) {
                container.innerHTML = `<span style="color: #ff3333;">Netzwerkfehler: ${error.message}</span>`;
            }
        }

        checkApiStatus();
    </script>
</body>
</html>
